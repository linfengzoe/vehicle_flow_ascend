[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-flow-ascend"
version = "0.1.0"
description = "Vehicle flow counting demo with PC and Ascend configuration support."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imageio-ffmpeg",
    "numpy<2",
    "opencv-python",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
vehicle-flow-ascend = "vehicle_flow_ascend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vehicle_flow_ascend = ["web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
